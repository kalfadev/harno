[package]
name = "harno"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ai", "agents", "harness", "cli", "claude"]
categories = ["command-line-utilities", "development-tools"]
description = "The agent harness of harno: commands through one allow list, filtered output, a verbatim log, and tools"

[lib]
path = "src/lib.rs"

[[bin]]
name = "harno"
path = "src/main.rs"

[dependencies]
harno-log = { path = "../harno-log" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "1"
glob = "0.3"
similar = "2"
regex = "1"

# The sandbox of Linux: a Landlock ruleset, built before the fork and applied
# in the child. macOS needs no crate: it wraps the program in sandbox-exec.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# Signals: a signal to harno goes on to the process groups of its commands.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The signal tests start the binary, which a signal can reach on its own.
[dev-dependencies]
tempfile = "3"
serde_json = "1"
