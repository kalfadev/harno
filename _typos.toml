# What typos (the spell preset, in ci) must not call a typo.
[default]
# node ids are six random hex characters
extend-ignore-re = ["\\b[0-9a-f]{6}\\b"]

[default.extend-words]
# misspelt on purpose: tests that an unknown config field is refused
alow = "alow"
dorp = "dorp"
# cytoscape's name for a collection of elements
eles = "eles"
