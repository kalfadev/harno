# harno filter for `pytest` (harno tool add pytest-filter)
filter:
  command: pytest
  # A pass: the summary line.
  keep: ['^=+ .*(passed|failed|error|skipped|no tests ran).* =+$']
  on_fail:
    # A failure: the failure report and the short summary, not the progress
    # lines of the tests that passed.
    drop: ['^\S+\.py [.sxX]+\s+\[\s*\d+%\]$', '^platform ', '^rootdir: ', '^plugins: ', '^cachedir: ']
    tail: 200
  tests:
    - input: |2
        ============================= test session starts ==============================
        platform linux -- Python 3.12.0, pytest-8.0.0
        collected 3 items

        test_a.py ...                                                            [100%]

        ============================== 3 passed in 0.01s ===============================
      expected: |2
        ============================== 3 passed in 0.01s ===============================
