# harno filter for `go test` (harno tool add go-test-filter)
filter:
  command: go test
  drop: ['^=== (RUN|PAUSE|CONT)', '^\s*--- PASS:', '^PASS$']
  on_empty: 'go test: ok'
  on_fail:
    drop: ['^=== (RUN|PAUSE|CONT)', '^\s*--- PASS:']
  tests:
    - input: |2
        === RUN   TestA
        --- PASS: TestA (0.00s)
        PASS
        ok  	example.com/foo	0.002s
      expected: |2
        ok  	example.com/foo	0.002s
    - exit: 1
      input: |2
        === RUN   TestA
        --- PASS: TestA (0.00s)
        === RUN   TestB
            foo_test.go:9: got 1, want 2
        --- FAIL: TestB (0.00s)
        FAIL
        FAIL	example.com/foo	0.002s
      expected: |2
            foo_test.go:9: got 1, want 2
        --- FAIL: TestB (0.00s)
        FAIL
        FAIL	example.com/foo	0.002s
