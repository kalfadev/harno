[workspace]
resolver = "2"
members = ["crates/harno", "crates/harno-log", "crates/harno-test", "tools/analytics"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/kalfadev/harno"
homepage = "https://github.com/kalfadev/harno"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
