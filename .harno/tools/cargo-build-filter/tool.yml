# harno filter for `cargo build` (harno tool add cargo-build-filter)
filter:
  command: cargo build
  drop:
    - '^\s+(Compiling|Downloaded|Downloading|Checking|Blocking|Locking|Updating|Adding)\b'
  # A rustc line carries a type or a macro expansion whole; the rest is in the log.
  width: 200
  on_empty: 'cargo build: ok'
  tests:
    - input: |2
           Compiling foo v0.1.0
            Finished `dev` profile [unoptimized + debuginfo] target(s) in 0.5s
      expected: |2
            Finished `dev` profile [unoptimized + debuginfo] target(s) in 0.5s
    - exit: 101
      input: |2
           Compiling foo v0.1.0
        error[E0425]: cannot find value `x` in this scope
         --> src/lib.rs:1:13
        error: could not compile `foo` (lib) due to 1 previous error
      expected: |2
        error[E0425]: cannot find value `x` in this scope
         --> src/lib.rs:1:13
        error: could not compile `foo` (lib) due to 1 previous error
